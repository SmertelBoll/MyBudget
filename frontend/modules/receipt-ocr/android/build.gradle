plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receiptocr'
version = '1.0.0'

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The Latin model is bundled in the app (works offline, no download from Google Play services on first use).
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
